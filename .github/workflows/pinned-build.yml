name: Pinned login-fix build

# Manual build of LiveContainer's stock SideStore variant (no login-fix PR).
# Fails unless HEAD and the SideSign submodule are exactly the audited commits.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build SideStore (pinned)
    runs-on: xcode-27

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 2

      - name: Verify audited commits
        run: |
          set -e
          # HEAD is the audited PR commit plus this one workflow file, nothing else.
          test "$(git rev-parse HEAD^)" = "ee3cc16a67f9fed766f79a0ed70938f0f8ad5a07"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/pinned-build.yml"
          test "$(git -C Dependencies/SideSign rev-parse HEAD)" = "752d1ef602aa792a432ffa1e71646dc1ecf7363c"
          echo "pinned commits OK"

      - run: brew install ldid xcbeautify

      - name: Setup Env
        run: |
          MARKETING_VERSION=$(python3 scripts/ci/workflow.py get-marketing-version)
          NORMALIZED_VERSION="${MARKETING_VERSION}-lc-stock+ee3cc16"
          python3 scripts/ci/workflow.py set-marketing-version "$NORMALIZED_VERSION"
          echo "MARKETING_VERSION=$NORMALIZED_VERSION" | tee -a $GITHUB_ENV

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "27.2"

      - name: Build
        run: |
          python3 scripts/ci/workflow.py build

      - name: Publish SideStore.ipa to a release in this repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256 SideStore.ipa 2>/dev/null || shasum -a 256 SideStore.ipa
          gh release delete lc-stock -y --cleanup-tag || true
          gh release create lc-stock SideStore.ipa --title "SideStore (LiveContainer variant, stock)" --notes "Built from ee3cc16 (LiveContainerSupport, no extra patches)." --prerelease

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: build/logs
